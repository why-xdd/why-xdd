<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="queueviz — an interactive simulation of queue disciplines, backpressure and fair queueing.">
  <title>queueviz</title>

  <style>
    /* Queued items age from cool to warm as they wait, and each worker fills
       across its slot — both exactly as the running app draws them. */
    .q rect { animation: age 2.6s ease-in-out infinite; }
    @keyframes age { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    .w { transform-box: fill-box; transform-origin: left center; animation: serve 2.6s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes serve {
      0%        { transform: scaleX(.05); }
      70%, 100% { transform: scaleX(1);   }
    }
    @media (prefers-reduced-motion: reduce) { .q rect, .w { animation: none; opacity: 1; } }
  </style>
  <defs>
    <radialGradient id="qvGlow" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="580" height="200" rx="12" fill="#11161D" stroke="#1F2833" stroke-width="2"/>
  <rect width="580" height="200" rx="12" fill="url(#qvGlow)"/>
  <rect x="0" y="0" width="4" height="200" rx="2" fill="#34D399"/>

  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
    <text x="28" y="42" font-size="19" font-weight="700" fill="#E6EDF3">queueviz</text>
    <rect x="140" y="26" width="94" height="20" rx="10" fill="#3178C6" fill-opacity="0.16" stroke="#2A5E9E"/>
    <text x="187" y="40" font-size="10" fill="#79B8FF" text-anchor="middle">TypeScript</text>

    <text x="28" y="70" font-size="12.5" fill="#8B98A8">Watch the behaviour that decides your tail</text>
    <text x="28" y="90" font-size="12.5" fill="#8B98A8">latency. Live, seeded, in the browser.</text>

    <!-- Arrivals, a queue, and workers — the same left-to-right pipeline the
         app itself draws, so the card previews the thing rather than decorating it. -->
    <g transform="translate(28 112)">
      <g fill="#5A6675">
        <circle cx="4" cy="10" r="3"/>
        <circle cx="4" cy="24" r="3"/>
        <circle cx="14" cy="17" r="3"/>
      </g>

      <path d="M 22 17 L 36 17" stroke="#2C3846" stroke-width="1.5"/>

      <g class="q" fill="#22D3EE">
        <rect x="40" y="4"  width="9" height="9" rx="2"/>
        <rect x="52" y="4"  width="9" height="9" rx="2" fill-opacity="0.85"/>
        <rect x="64" y="4"  width="9" height="9" rx="2" fill-opacity="0.7"/>
        <rect x="76" y="4"  width="9" height="9" rx="2" fill="#FBBF24"/>
        <rect x="40" y="17" width="9" height="9" rx="2" fill-opacity="0.6"/>
        <rect x="52" y="17" width="9" height="9" rx="2" fill-opacity="0.5"/>
        <rect x="64" y="17" width="9" height="9" rx="2" fill="#FBBF24" fill-opacity="0.8"/>
        <rect x="76" y="17" width="9" height="9" rx="2" fill="#F87171"/>
        <rect x="40" y="30" width="9" height="9" rx="2" fill-opacity="0.4"/>
        <rect x="52" y="30" width="9" height="9" rx="2" fill="#F87171" fill-opacity="0.7"/>
      </g>

      <path d="M 92 17 L 106 17" stroke="#2C3846" stroke-width="1.5"/>

      <g>
        <rect x="110" y="2"  width="58" height="9" rx="4" fill="#1F2833"/>
        <rect class="w" x="110" y="2"  width="42" height="9" rx="4" fill="#A78BFA"/>
        <rect x="110" y="15" width="58" height="9" rx="4" fill="#1F2833"/>
        <rect class="w" style="animation-delay:-.6s" x="110" y="15" width="20" height="9" rx="4" fill="#22D3EE"/>
        <rect x="110" y="28" width="58" height="9" rx="4" fill="#1F2833"/>
        <rect class="w" style="animation-delay:-1.2s" x="110" y="28" width="50" height="9" rx="4" fill="#F472B6"/>
      </g>
      <text x="0" y="54" font-size="9" fill="#5A6675">arrivals → queue → workers</text>
    </g>

    <g transform="translate(348 110)">
      <text x="0" y="8" font-size="10" fill="#5A6675">7 PRESETS</text>
      <text x="0" y="28" font-size="11" fill="#8B98A8">the knee <tspan fill="#5A6675">· collapse</tspan></text>
      <text x="0" y="46" font-size="11" fill="#8B98A8">backpressure <tspan fill="#5A6675">· starvation</tspan></text>
      <text x="0" y="64" font-size="11" fill="#8B98A8">noisy neighbour</text>
      <text x="0" y="84" font-size="10" fill="#5A6675">0 runtime deps · 7.6 kB gzip</text>
    </g>
  </g>
</svg>
