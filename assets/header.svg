<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Artem — backend and ML engineer. Python, Go, FastAPI, real-time audio.">
  <title>Artem — backend and ML engineer</title>

  <defs>
    <!-- The aurora: three soft blobs rather than a linear gradient, so the
         colour has a direction and a source instead of an even wash. -->
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C7CE0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C7CE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6EDF3"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="waveFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#7C7CE0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="ruleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#7C7CE0"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2C3846" fill-opacity="0.5"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="280" rx="16"/>
    </clipPath>

    <!-- The wave is drawn twice, end to end, inside a clip. Sliding the pair by
         exactly one copy's width and restarting reads as one endless signal
         rather than a loop that snaps back. -->
    <clipPath id="waveWindow">
      <rect x="0" y="-90" width="480" height="180"/>
    </clipPath>
  </defs>

  <style>
    /* Everything animates from a visible resting state, so a viewer who blocks
       animation still sees the finished composition rather than an empty box. */
    .aurora-a { animation: driftA 19s ease-in-out infinite; }
    .aurora-b { animation: driftB 23s ease-in-out infinite; }
    .aurora-c { animation: driftC 17s ease-in-out infinite; }

    @keyframes driftA {
      0%, 100% { transform: translate(0, 0)      scale(1);    }
      50%      { transform: translate(48px, 22px) scale(1.09); }
    }
    @keyframes driftB {
      0%, 100% { transform: translate(0, 0)        scale(1);    }
      50%      { transform: translate(-56px, -18px) scale(1.12); }
    }
    @keyframes driftC {
      0%, 100% { transform: translate(0, 0)       scale(1);    }
      50%      { transform: translate(30px, -26px) scale(0.92); }
    }

    /* One copy's width. The travel distance and the geometry must agree exactly
       or the seam shows as a jump every cycle. */
    .wave-scroll { animation: scroll 7s linear infinite; }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-480px); }
    }

    .bar { transform-box: fill-box; transform-origin: bottom; }
    .bar { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { transform: scaleY(0.45); }
      50%      { transform: scaleY(1);    }
    }

    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .rule { animation: widen 2.4s cubic-bezier(.16,1,.3,1) 1 both; }
    @keyframes widen { from { transform: scaleX(0.05); } to { transform: scaleX(1); } }

    .chip { animation: rise .7s cubic-bezier(.16,1,.3,1) both; }
    .chip-2 { animation-delay: .1s; }
    .chip-3 { animation-delay: .2s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* A viewer who asked for less motion gets the composition, held still. */
    @media (prefers-reduced-motion: reduce) {
      .aurora-a, .aurora-b, .aurora-c,
      .wave-scroll, .bar, .caret, .rule, .chip {
        animation: none;
      }
      .chip { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="#0D1117"/>
    <rect width="1200" height="280" fill="url(#dots)"/>

    <ellipse class="aurora-a" cx="200" cy="60"  rx="360" ry="220" fill="url(#glowA)"/>
    <ellipse class="aurora-b" cx="980" cy="240" rx="380" ry="230" fill="url(#glowB)"/>
    <ellipse class="aurora-c" cx="640" cy="20"  rx="300" ry="180" fill="url(#glowC)"/>

    <!-- Waveform: a nod to the real-time audio work, and the one element that
         makes this header his rather than generic. -->
    <g transform="translate(700 140)">
      <g clip-path="url(#waveWindow)">
        <g class="wave-scroll">
          <g fill="url(#waveFill)" opacity="0.9">
            <path d="
              M0,0
              C 12,-6 18,-34 30,-34 S 48,-8 60,-8 S 78,-52 90,-52 S 108,-14 120,-14
              S 138,-64 150,-64 S 168,-22 180,-22 S 198,-44 210,-44 S 228,-10 240,-10
              S 258,-38 270,-38 S 288,-16 300,-16 S 318,-58 330,-58 S 348,-24 360,-24
              S 378,-42 390,-42 S 408,-12 420,-12 S 438,-30 450,-30 S 468,-6 480,-6
              L 480,0
              C 468,6 462,30 450,30 S 432,6 420,6 S 402,42 390,42 S 372,12 360,12
              S 342,54 330,54 S 312,18 300,18 S 282,36 270,36 S 252,8 240,8
              S 222,32 210,32 S 192,14 180,14 S 162,50 150,50 S 132,20 120,20
              S 102,36 90,36 S 72,10 60,10 S 42,28 30,28 S 12,6 0,0 Z"/>
            <path transform="translate(480 0)" d="
              M0,0
              C 12,-6 18,-34 30,-34 S 48,-8 60,-8 S 78,-52 90,-52 S 108,-14 120,-14
              S 138,-64 150,-64 S 168,-22 180,-22 S 198,-44 210,-44 S 228,-10 240,-10
              S 258,-38 270,-38 S 288,-16 300,-16 S 318,-58 330,-58 S 348,-24 360,-24
              S 378,-42 390,-42 S 408,-12 420,-12 S 438,-30 450,-30 S 468,-6 480,-6
              L 480,0
              C 468,6 462,30 450,30 S 432,6 420,6 S 402,42 390,42 S 372,12 360,12
              S 342,54 330,54 S 312,18 300,18 S 282,36 270,36 S 252,8 240,8
              S 222,32 210,32 S 192,14 180,14 S 162,50 150,50 S 132,20 120,20
              S 102,36 90,36 S 72,10 60,10 S 42,28 30,28 S 12,6 0,0 Z"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Spectrum bars, echoing the waveform in a second register. Each one is
         offset so the row reads as a level meter, not a chorus line. -->
    <g transform="translate(700 232)" opacity="0.55">
      <rect class="bar" style="animation-delay:-0.05s" x="0"   y="-18" width="4" height="18" rx="2" fill="#22D3EE"/>
      <rect class="bar" style="animation-delay:-0.31s" x="12"  y="-34" width="4" height="34" rx="2" fill="#22D3EE"/>
      <rect class="bar" style="animation-delay:-0.62s" x="24"  y="-10" width="4" height="10" rx="2" fill="#7C7CE0"/>
      <rect class="bar" style="animation-delay:-0.18s" x="36"  y="-44" width="4" height="44" rx="2" fill="#7C7CE0"/>
      <rect class="bar" style="animation-delay:-0.87s" x="48"  y="-24" width="4" height="24" rx="2" fill="#7C7CE0"/>
      <rect class="bar" style="animation-delay:-0.44s" x="60"  y="-52" width="4" height="52" rx="2" fill="#A78BFA"/>
      <rect class="bar" style="animation-delay:-1.02s" x="72"  y="-16" width="4" height="16" rx="2" fill="#A78BFA"/>
      <rect class="bar" style="animation-delay:-0.24s" x="84"  y="-38" width="4" height="38" rx="2" fill="#A78BFA"/>
      <rect class="bar" style="animation-delay:-0.71s" x="96"  y="-28" width="4" height="28" rx="2" fill="#F472B6"/>
      <rect class="bar" style="animation-delay:-0.13s" x="108" y="-46" width="4" height="46" rx="2" fill="#F472B6"/>
      <rect class="bar" style="animation-delay:-0.94s" x="120" y="-12" width="4" height="12" rx="2" fill="#F472B6"/>
      <rect class="bar" style="animation-delay:-0.38s" x="132" y="-30" width="4" height="30" rx="2" fill="#F472B6" fill-opacity="0.7"/>
      <rect class="bar" style="animation-delay:-0.79s" x="144" y="-20" width="4" height="20" rx="2" fill="#F472B6" fill-opacity="0.5"/>
      <rect class="bar" style="animation-delay:-0.55s" x="156" y="-36" width="4" height="36" rx="2" fill="#F472B6" fill-opacity="0.35"/>
      <rect class="bar" style="animation-delay:-1.11s" x="168" y="-14" width="4" height="14" rx="2" fill="#F472B6" fill-opacity="0.25"/>
    </g>

    <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="64" y="86" font-size="15" fill="#5A6675" letter-spacing="4">$ whoami<tspan class="caret" fill="#22D3EE" dx="6">▊</tspan></text>

      <text x="64" y="152" font-size="58" font-weight="700" fill="url(#nameFill)" letter-spacing="-1.5">Artem</text>

      <text x="64" y="190" font-size="19" fill="#8B98A8">
        Backend &amp; ML engineer <tspan fill="#3D4956">·</tspan> Python <tspan fill="#3D4956">·</tspan> Go
      </text>

      <text x="64" y="222" font-size="14" fill="#5A6675">
        CS @ Financial University, Moscow
      </text>

      <g font-size="12" font-weight="600">
        <g class="chip">
          <rect x="64"  y="240" width="128" height="24" rx="12" fill="#22D3EE" fill-opacity="0.10" stroke="#0E7490"/>
          <text x="128" y="256" fill="#22D3EE" text-anchor="middle">async services</text>
        </g>
        <g class="chip chip-2">
          <rect x="202" y="240" width="126" height="24" rx="12" fill="#A78BFA" fill-opacity="0.10" stroke="#5B21B6"/>
          <text x="265" y="256" fill="#A78BFA" text-anchor="middle">ML serving</text>
        </g>
        <g class="chip chip-3">
          <rect x="338" y="240" width="150" height="24" rx="12" fill="#F472B6" fill-opacity="0.10" stroke="#9D174D"/>
          <text x="413" y="256" fill="#F472B6" text-anchor="middle">real-time audio</text>
        </g>
      </g>
    </g>

    <rect class="rule" x="64" y="106" width="300" height="2" rx="1" fill="url(#ruleFill)"
          style="transform-box: fill-box; transform-origin: left center;"/>
    <rect x="0" y="0" width="1200" height="280" rx="16" fill="none" stroke="#1F2833" stroke-width="2"/>
  </g>
</svg>
