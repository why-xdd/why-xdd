<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Monogram: a W formed from a waveform.">
  <title>why-xdd</title>

  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#7C7CE0"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="mgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C7CE0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C7CE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* The stroke draws itself once on load, then stays. A mark that redraws
       forever competes with the text beside it for attention it does not need. */
    /* Resting state is the finished mark. The draw-in is an enhancement that
       borrows the hidden state for its own duration and hands it back. */
    .stroke {
      stroke-dasharray: 460;
      stroke-dashoffset: 0;
      animation: draw 1.8s cubic-bezier(.65,0,.35,1) .2s backwards;
    }
    @keyframes draw { from { stroke-dashoffset: 460; } }

    .node { opacity: 1; animation: land .5s ease-out backwards; }
    .n1 { animation-delay: .7s; } .n2 { animation-delay: 1.3s; } .n3 { animation-delay: 1.8s; }
    @keyframes land {
      from { opacity: 0; transform: scale(0.2); }
    }

    .halo { animation: breathe 6s ease-in-out infinite; transform-origin: 130px 130px; }
    @keyframes breathe {
      0%, 100% { opacity: .9; transform: scale(1);    }
      50%      { opacity: 1;  transform: scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stroke { stroke-dashoffset: 0; animation: none; }
      .node   { opacity: 1; animation: none; }
      .halo   { animation: none; }
    }
  </style>

  <rect width="260" height="260" rx="28" fill="#0D1117" stroke="#1F2833" stroke-width="2"/>
  <circle class="halo" cx="130" cy="130" r="110" fill="url(#mgGlow)"/>

  <!-- The W is drawn as a waveform rather than lettered: it says his initial
       and what he works on at the same time. -->
  <path class="stroke" d="M 44 92 L 74 168 L 104 112 L 130 178 L 156 112 L 186 168 L 216 92"
        fill="none" stroke="url(#mg)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#0D1117" stroke="url(#mg)" stroke-width="3">
    <circle class="node n1" cx="44"  cy="92"  r="5" style="transform-box: fill-box; transform-origin: center;"/>
    <circle class="node n2" cx="130" cy="178" r="5" style="transform-box: fill-box; transform-origin: center;"/>
    <circle class="node n3" cx="216" cy="92"  r="5" style="transform-box: fill-box; transform-origin: center;"/>
  </g>

  <text x="130" y="222" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="15" fill="#5A6675" letter-spacing="3">why-xdd</text>
</svg>
