<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Terminal output describing Artem's focus, stack and current work.">
  <title>whoami</title>

  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161C25"/>
      <stop offset="100%" stop-color="#11161D"/>
    </linearGradient>
    <clipPath id="window">
      <rect x="0" y="0" width="760" height="330" rx="12"/>
    </clipPath>
  </defs>

  <style>
    /* Lines arrive in the order the session produced them. A terminal that
       reveals its output bottom-up or all at once stops reading as a session. */
    /* Visible at rest; the reveal borrows the hidden state for its own run.
       A line that depends on an animation to become visible disappears
       entirely whenever that animation is throttled or blocked. */
    .line { opacity: 1; animation: appear .35s ease-out backwards; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(4px); }
    }

    .l1 { animation-delay: .15s; } .l2 { animation-delay: .55s; }
    .l3 { animation-delay: .8s;  } .l4 { animation-delay: 1.25s; }
    .l5 { animation-delay: 1.5s; } .l6 { animation-delay: 1.65s; }
    .l7 { animation-delay: 1.8s; } .l8 { animation-delay: 1.95s; }
    .l9 { animation-delay: 2.35s; }

    /* The caret only blinks once the last line has landed, so it never appears
       to be waiting on output that is still arriving. */
    .caret { animation: blink 1.1s steps(1) 2.7s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .line, .caret { opacity: 1; animation: none; }
    }
  </style>

  <g clip-path="url(#window)">
    <rect width="760" height="330" fill="#0D1117"/>

    <rect width="760" height="38" fill="url(#chrome)"/>
    <line x1="0" y1="38" x2="760" y2="38" stroke="#1F2833"/>
    <circle cx="22" cy="19" r="5.5" fill="#F87171"/>
    <circle cx="42" cy="19" r="5.5" fill="#FBBF24"/>
    <circle cx="62" cy="19" r="5.5" fill="#34D399"/>
    <text x="380" y="24" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="12" fill="#5A6675" text-anchor="middle">artem@vibecode — zsh</text>

    <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14">
      <text class="line l1" x="24" y="76">
        <tspan fill="#34D399">➜</tspan>
        <tspan fill="#7C7CE0" dx="10">~</tspan>
        <tspan fill="#E6EDF3" dx="10">cat about.md</tspan>
      </text>

      <text class="line l2" x="24" y="112" fill="#8B98A8">
        Backend developer. I like the parts of a system that decide
      </text>
      <text class="line l2" x="24" y="134" fill="#8B98A8">
        whether it stays up: queues, batching, backpressure, rollout.
      </text>

      <text class="line l3" x="24" y="176">
        <tspan fill="#34D399">➜</tspan>
        <tspan fill="#7C7CE0" dx="10">~</tspan>
        <tspan fill="#E6EDF3" dx="10">stack --top</tspan>
      </text>

      <text class="line l5" x="24" y="208" font-size="13">
        <tspan fill="#5A6675">lang  </tspan><tspan fill="#22D3EE">Python</tspan><tspan fill="#3D4956">  ·  </tspan><tspan fill="#22D3EE">Go</tspan><tspan fill="#3D4956">  ·  </tspan><tspan fill="#22D3EE">TypeScript</tspan><tspan fill="#3D4956">  ·  </tspan><tspan fill="#22D3EE">SQL</tspan>
      </text>
      <text class="line l6" x="24" y="230" font-size="13">
        <tspan fill="#5A6675">web   </tspan><tspan fill="#A78BFA">FastAPI</tspan><tspan fill="#3D4956">  ·  </tspan><tspan fill="#A78BFA">aiogram 3</tspan><tspan fill="#3D4956">  ·  </tspan><tspan fill="#A78BFA">asyncio</tspan>
      </text>
      <text class="line l7" x="24" y="252" font-size="13">
        <tspan fill="#5A6675">data  </tspan><tspan fill="#F472B6">PostgreSQL</tspan><tspan fill="#3D4956">  ·  </tspan><tspan fill="#F472B6">Redis</tspan><tspan fill="#3D4956">  ·  </tspan><tspan fill="#F472B6">SQLite</tspan><tspan fill="#3D4956">  ·  </tspan><tspan fill="#F472B6">pgvector</tspan>
      </text>
      <text class="line l8" x="24" y="274" font-size="13">
        <tspan fill="#5A6675">ship  </tspan><tspan fill="#FBBF24">Docker</tspan><tspan fill="#3D4956">  ·  </tspan><tspan fill="#FBBF24">GitHub Actions</tspan><tspan fill="#3D4956">  ·  </tspan><tspan fill="#FBBF24">Prometheus</tspan>
      </text>

      <text class="line l9" x="24" y="312">
        <tspan fill="#34D399">➜</tspan>
        <tspan fill="#7C7CE0" dx="10">~</tspan>
        <tspan fill="#E6EDF3" dx="10">open to internships</tspan>
      </text>
      <text class="caret" x="270" y="312" fill="#22D3EE" font-size="14">▊</text>
    </g>

    <rect x="0" y="0" width="760" height="330" rx="12" fill="none" stroke="#1F2833" stroke-width="2"/>
  </g>
</svg>
